
###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Custom binds
bind = $mainMod, space, exec, $menu
bind = $mainMod, backspace, killactive,
bind = $mainMod, W, killactive

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# App Binds
# bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = CTRL ALT, E, exec, emote
# bind = $mainMod, Z, exec, $browser

# Control Binds
# bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, S, togglesplit, # dwindle
bind = $mainMod, L, exec, systemctl suspend # Lock screen
bind = $mainMod, K, exec, killall swayidle # kill swayidle
bind = ALT CTRL, W, exec, killall waybar; killall quickshell; waybar
bind = ALT CTRL, Q, exec, killall waybar; killall quickshell; ~/.config/quickshell/launchshell.sh
bind = $mainMod SHIFT, X, exec, shutdown now
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o "./pictures/screenshots"


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, hyprsome workspace 1
bind = $mainMod, 2, exec, hyprsome workspace 2
bind = $mainMod, 3, exec, hyprsome workspace 3
bind = $mainMod, 4, exec, hyprsome workspace 4
bind = $mainMod, 5, exec, hyprsome workspace 5
bind = $mainMod, 6, exec, hyprsome workspace 6
bind = $mainMod, 7, exec, hyprsome workspace 7
bind = $mainMod, 8, exec, hyprsome workspace 8
bind = $mainMod, 9, exec, hyprsome workspace 9
bind = $mainMod, 0, exec, hyprsome workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, hyprsome move 1
bind = $mainMod SHIFT, 2, exec, hyprsome move 2
bind = $mainMod SHIFT, 3, exec, hyprsome move 3
bind = $mainMod SHIFT, 4, exec, hyprsome move 4
bind = $mainMod SHIFT, 5, exec, hyprsome move 5
bind = $mainMod SHIFT, 6, exec, hyprsome move 6
bind = $mainMod SHIFT, 7, exec, hyprsome move 7
bind = $mainMod SHIFT, 8, exec, hyprsome move 8
bind = $mainMod SHIFT, 9, exec, hyprsome move 9
bind = $mainMod SHIFT, 0, exec, hyprsome move 10

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize windows
bind = $mainMod CTRL, right, resizeactive, 75 0
bind = $mainMod CTRL, left, resizeactive, -75 0
bind = $mainMod CTRL, up, resizeactive, 0 -75
bind = $mainMod CTRL, down, resizeactive, 0 75

# Master Layout Keybinds
bind = $mainMod, TAB, layoutmsg, swapwithmaster master
bind = $mainMod, U, layoutmsg, addmaster
bind = $mainMod, I, layoutmsg, removemaister
bind = $mainMod, O, layoutmsg, orientationnext

# Special workspace (scratchpad)
bind = $mainMod , Q, togglespecialworkspace, terminal
bind = $mainMod SHIFT, Q, movetoworkspace, special:terminal
bind = $mainMod, S, togglespecialworkspace, obsidian
# bind = $mainMod SHIFT, S, movetoworkspace, special:obsidian
bind = $mainMod, D, togglespecialworkspace, texts
bind = $mainMod SHIFT, D, movetoworkspace, special:texts
bind = $mainMod, F, togglespecialworkspace, texts
bind = $mainMod SHIFT, Q, movetoworkspace, special:texts
bind = $mainMod, A, togglespecialworkspace, music
bind = $mainMod SHIFT, A, movetoworkspace, special:music
bind = $mainMod, X, exec, hyprctl dispatch togglespecialworkspace; hyprctl dispatch togglespecialworkspace # Closes any special workspace


# Open Apps
bind = $mainMod CTRL, Q, exec, $terminal
bind = $mainMod CTRL SHIFT, Q, exec, [workspace special:terminal] $terminal
bind = $mainMod CTRL, D, exec, [workspace special:texts] beeper
bind = $mainMod CTRL SHIFT, D, exec, discord
bind = $mainMod CTRL, S, exec, [workspace special:obsidian] obsidian
# bind = $mainMod CTRL, A, exec, [workspace special:music] kitty -e spotify_player
bind = $mainMod CTRL, A, exec, [workspace special:music] spotify
bind = $mainMod, C, exec, ~/.local/bin/zed
bind = $mainMod CTRL, C, exec, ~/.local/bin/zed
bind = $mainMod CTRL SHIFT, C, exec, cursor
bind = $mainMod CTRL, Z, exec, $browser
bind = $mainMod CTRL SHIFT, Z, exec, $altbrowser

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

gesture = 3, horizontal, workspace
gesture = 3, down, dispatcher, exec, hyprctl dispatch togglespecialworkspace; hyprctl dispatch togglespecialworkspace


###################
### KEYBINDINGS ###
###################

# SUPER and Alt are reserved for OS operations
# CTRL is a modifier key
# Shift is reserved for App operations (Don't add to keybinds)
# Exception for shift is screenshots

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# ----- CONTROL -----
# Custom binds
bind = $mainMod, space, exec, $menu
# bind = $mainMod, space, exec, qs ipc call launcher toggle

# Kill Apps
bind = $mainMod, backspace, killactive
bind = $mainMod CTRL, W, killactive
bind = $mainMod, grave, killactive
bind = ALT, W, killactive

# Suspend and Exit
bind = $mainMod, M, exit,
bind = SUPER, L, exec, systemctl suspend # Lock screen
bind = $mainMod, K, exec, killall swayidle # kill swayidle
# bind = ALT CTRL, X, exec, shutdown now

# Screenshot
bind = $mainMod CTRL SHIFT, S, exec, hyprshot -m region -o "./pictures/screenshots"

# Widgets
bind = $mainMod SHIFT CTRL, W, exec, killall waybar; killall quickshell; waybar
bind = $mainMod SHIFT CTRL, Q, exec, killall waybar; killall quickshell; ~/.config/quickshell/launchshell.sh

# ----- LAYOUT MANAGEMENT -----
# Switch workspaces with mainMod + [0-9]

bind = $mainMod, Q, exec, hyprsome workspace 1
bind = $mainMod, W, exec, hyprsome workspace 2
bind = $mainMod, E, exec, hyprsome workspace 3
bind = $mainMod, A, exec, hyprsome workspace 4
bind = $mainMod, S, exec, hyprsome workspace 5
bind = $mainMod, D, exec, hyprsome workspace 6
bind = $mainMod, Z, exec, hyprsome workspace 7
bind = $mainMod, X, exec, hyprsome workspace 8
bind = $mainMod, C, exec, hyprsome workspace 9
bind = $mainMod, V, exec, hyprsome workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]

bind = $mainMod SHIFT, Q, exec, hyprsome move 1
bind = $mainMod SHIFT, W, exec, hyprsome move 2
bind = $mainMod SHIFT, E, exec, hyprsome move 3
bind = $mainMod SHIFT, A, exec, hyprsome move 4
bind = $mainMod SHIFT, S, exec, hyprsome move 5
bind = $mainMod SHIFT, D, exec, hyprsome move 6
bind = $mainMod SHIFT, Z, exec, hyprsome move 7
bind = $mainMod SHIFT, X, exec, hyprsome move 8
bind = $mainMod SHIFT, C, exec, hyprsome move 9
bind = $mainMod SHIFT, V, exec, hyprsome move 10

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, j, movefocus, u
bind = $mainMod, k, movefocus, d

# Resize windows
bind = $mainMod CTRL, right, resizeactive, 75 0
bind = $mainMod CTRL, left, resizeactive, -75 0
bind = $mainMod CTRL, up, resizeactive, 0 -75
bind = $mainMod CTRL, down, resizeactive, 0 75

bind = $mainMod CTRL, h, resizeactive, 75 0
bind = $mainMod CTRL, l, resizeactive, -75 0
bind = $mainMod CTRL, j, resizeactive, 0 -75
bind = $mainMod CTRL, k, resizeactive, 0 75
# Master Layout Keybinds
bind = $mainMod, TAB, layoutmsg, swapwithmaster master
bind = $mainMod, U, layoutmsg, addmaster
bind = $mainMod, I, layoutmsg, removemaster
bind = $mainMod, O, layoutmsg, orientationnext

# Other Layout
bind = $mainMod , F, togglefloating,

# ----- OPENING APPS -----

# Main
bind = $mainMod, 1, exec, $terminal
bind = $mainMod, 4, exec, $fileManager

# Editors
bind = $mainMod, 2, exec, $editor
bind = $mainMod SHIFT, 2, exec, $alteditor

# Obsidian
# bind = ALT, S, exec, [workspace special:obsidian] obsidian

# Browser
bind = $mainMod, 3, exec, $browser
bind = $mainMod SHIFT, 3, exec, $altbrowser

# Workspace Apps
$appWorkspace = ~/.config/hypr/scripts/app_workspace.py
bind = $mainMod CTRL, A, exec, $appWorkspace obsidian
bind = $mainMod CTRL, Z, exec, $appWorkspace beeper
bind = $mainMod CTRL, D, exec, $appWorkspace discord
bind = $mainMod CTRL, S, exec, $appWorkspace slack
bind = $mainMod CTRL, X, exec, hyprctl dispatch togglespecialworkspace; hyprctl dispatch togglespecialworkspace # Closes any special workspace
bind = ALT, X, exec, hyprctl dispatch togglespecialworkspace; hyprctl dispatch togglespecialworkspace # Closes any special workspace

# ----- CONTROLS -----

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Mouse Buttons
#   mouse:275 : Side Button 1 (Back, usually second one)
#   mouse:276 : Side Button 2 (Forward, usually first one)

bind = CTRL, mouse:276, exec, $appWorkspace obsidian
bind = CTRL, mouse:275, exec, hyprctl dispatch togglespecialworkspace; hyprctl dispatch togglespecialworkspace # Closes any special workspace

bind = $mainMod, mouse:275, killactive

# Gestures
gesture = 3, horizontal, workspace
# gesture = 4, up, dispatcher, movetoworkspace, special:obsidian
gesture = 3, up, dispatcher, exec, $appWorkspace obsidian
gesture = 3, down, dispatcher, exec, hyprctl dispatch togglespecialworkspace; hyprctl dispatch togglespecialworkspace

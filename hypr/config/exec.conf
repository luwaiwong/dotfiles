

#################
### AUTOSTART ###
#################

# exec-once = $terminal
exec-once = powertop --auto-tune
exec-once = syncthing --no-browser
exec-once = ~/.config/quickshell/launchshell.sh
exec-once = systemctl start bluetooth.service
exec-once = mpris-proxy
exec-once = nm-applet
exec-once = mako
exec-once = swww-daemon
exec-once = swayidle -w timeout 360 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'
exec-once = spicetify backup apply
exec-once = betterdiscordctl install

exec-once = xdg-mime default Thunar.desktop inode/directory
exec-once = xdg-mime default Thunar.desktop x-directory/normal
exec-once = xdg-mime default Thunar.desktop application/x-gnome-saved-search
exec-once = xdg-mime default Thunar.desktop application/x-directory
exec-once = xdg-mime default helium-browser.desktop application/pdf
exec-once = xdg-settings set default-web-browser helium-browser.desktop

# themes
exec = gsettings set org.gnome.desktop.interface gtk-theme "Nordic"   # for GTK3 apps
# exec = gsettings set org.gnome.desktop.interface icon-theme "Zafiro-Nord-Black"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec = gsettings set org.cinnamon.desktop.default-applications.terminal exec 'ghostty'
exec = gsettings set org.gnome.desktop.default-applications.file-manager exec 'thunar'

# idr know what these do :)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

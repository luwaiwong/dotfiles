

################# 
### AUTOSTART ###
#################


exec-once = $terminal
exec-once = powertop --auto-tune
exec-once = syncthing --no-browser
exec-once = swayidle -w timeout 360 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'
exec-once = waybar
exec-once = systemctl start bluetooth.service
exec-once = nm-applet
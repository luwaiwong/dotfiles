
##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
      match:class = .*
        suppress_event = maximize
}

windowrule {
    name = terminal-tile
      match:class = ^(${terminal})$
        tile = on
}

windowrule {
    name = filemanager-float
    match:class = thunar
    float = on
    size = 800 600
}

windowrule {
      name = nemo-float
      match:class = nemo
      float = on
      size = 800 600
}


windowrule {
    name = xdg-portal-float
    match:class = xdg-desktop-portal-gtk
    float = on
    size = 800 600
}


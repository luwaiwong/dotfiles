################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

monitor= eDP-1, highres, auto, 2
monitor = DP-2, 2560x1600@60, 1440x0, 1.6, bitdepth, 8
monitor = DP-3, 2560x1600@60, 1440x0, 1.6, bitdepth, 8
# monitor = DP-2, addreserved, 10, 10, 10, 10
# monitor = DP-4, highres, auto, 1

workspace=1,monitor:eDP-1
workspace=2,monitor:eDP-1
workspace=3,monitor:eDP-1
workspace=4,monitor:eDP-1
workspace=5,monitor:eDP-1
workspace=6,monitor:eDP-1
workspace=7,monitor:eDP-1
workspace=8,monitor:eDP-1
workspace=9,monitor:eDP-1
workspace=10,monitor:eDP-1

# workspace=11,monitor:DP-2
# workspace=12,monitor:DP-2
# workspace=13,monitor:DP-2
# workspace=14,monitor:DP-2
# workspace=15,monitor:DP-2
# workspace=16,monitor:DP-2
# workspace=17,monitor:DP-2
# workspace=18,monitor:DP-2
# workspace=19,monitor:DP-4
# workspace=20,monitor:DP-4

env = GDK_SCALE,1
env = GDK_DPI_SCALE,1
env = QT_SCALE_FACTOR,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = _JAVA_OPTIONS, -Dsun.java2d.uiScale=2
